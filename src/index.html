<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="game">
      <span class="score">{{ scoreLabel }}</span>
      <div class="banguela" :class="{ jump: isJumping }" ref="banguelaRef"></div>
      <div class="cacto" ref="cactoRef"></div>
    </div>

    <button class="restart" @click="resetGame" v-if="isGameOver">Recomeçar</button>
    <p class="status" v-if="statusMessage">{{ statusMessage }}</p>
    <p class="hint">Use a seta para cima ou a barra de espaço para pular.</p>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="script.js"></script>
</body>
</html>
